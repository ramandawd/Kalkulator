<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous">
    </script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <script src="script.js"></script>
    <center>

        <h1 class="calculator-title">Tambah angka</h1>

        <div class="form-floating mb-3">
            <label for="angka1">Angka 1</label>
            <input type="number" class="form-control" id="angka1" placeholder="">
            
        </div>
        <div class="form-floating mb-3">
            <label for="floatingPassword">Angka 2</label>
            <input type="number" class="form-control" id="angka2" placeholder="">
        </div>

        <div class="btn-grid">
            <button class="btn-calc btn-tambah" onclick="tambah()">+</button>
            <button class="btn-calc btn-kurang" onclick="kurang()">-</button>
            <button class="btn-calc btn-kali" onclick=" kali ()">×</button>
            <button class="btn-calc btn-bagi" onclick=" bagi ()">÷ </button>
            <button class="btn-calc btn-Persen" onclick=" persen()">% </button>
            <button class="btn-calc btn-Sisa_Bagi" onclick="Mod()">Mod</button>
            <button class="btn-calc btn-reset" onclick="reset()">reset</button>
        </div>

        <div id="hasil" class="hasil-box">Hasil: </div>
